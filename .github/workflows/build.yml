name: Build Bloom

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Check game detection on real Windows
        run: node scripts/check-game-detection.mjs

      # Version = major.minor from package.json + the build number, so every
      # push to main is a new version and installed apps auto-update to it.
      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build Windows installer
        shell: bash
        run: npm run dist:win -- --config.extraMetadata.version=${{ steps.ver.outputs.version }}

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: Bloom-Windows-Setup
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      # Every successful build of main publishes a release. latest.yml is what
      # installed copies of Bloom read to find and download the update.
      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Bloom ${{ steps.ver.outputs.version }}
          make_latest: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          body: |
            🌸 **Install Bloom:** download **Bloom-Setup-${{ steps.ver.outputs.version }}.exe** below and double-click it.
            It installs in one click (no admin needed) and opens Bloom when it's done.

            If Windows shows *"Windows protected your PC"*, click **More info → Run anyway** (the app isn't code-signed yet).

            Moving to a new PC? In Bloom: **Settings → Backup → Save backup…**, then install on the new PC and **Restore backup…**.

            📱 **Android phone:** open this page on the phone, download **Bloom-${{ steps.ver.outputs.version }}.apk** and open it (allow "install unknown apps" for your browser once). After that, Bloom shows **Update available** by itself.

  # The Android app (Capacitor): same web code, built into an APK.
  android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Same version as the Windows build, so the phone and PC match.
      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build web app and copy it into the Android project
        run: |
          npx vite build
          npx cap sync android

      # The release key lives in two GitHub secrets. Every update must be
      # signed with the same key, or Android refuses to install it.
      - name: Release key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bloom-release.p12"
            echo "BLOOM_KEYSTORE_FILE=$RUNNER_TEMP/bloom-release.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a test APK only (not published)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          BLOOM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          TASK=assembleDebug; OUT=debug/app-debug.apk
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then TASK=assembleRelease; OUT=release/app-release.apk; fi
          ./gradlew "$TASK" --no-daemon -PbloomVersionName=${{ steps.ver.outputs.version }} -PbloomVersionCode=${{ github.run_number }}
          mkdir -p ../release-apk
          cp "app/build/outputs/apk/$OUT" "../release-apk/Bloom-${{ steps.ver.outputs.version }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Bloom-Android
          path: release-apk/*.apk
          if-no-files-found: error

  # After the Windows job made the release: add the APK to it.
  android-release:
    needs: [windows, android]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.android.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: Bloom-Android
          path: apk
      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.android.outputs.version }}" apk/*.apk --clobber --repo "${{ github.repository }}"
