name: Build Bloom

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Check game detection on real Windows
        run: node scripts/check-game-detection.mjs

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: Bloom-Windows-Setup
          path: release/*.exe
          if-no-files-found: error

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Every successful build of main publishes (or refreshes) the release for
      # the version in package.json, so the installer is always one click away
      # on the repo's Releases page. Bump "version" to make a new release.
      - name: Publish release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Bloom ${{ steps.ver.outputs.version }}
          make_latest: true
          files: release/*.exe
          body: |
            🌸 **Install Bloom:** download **Bloom-Setup-${{ steps.ver.outputs.version }}.exe** below and double-click it.
            It installs in one click (no admin needed) and opens Bloom when it's done.

            If Windows shows *"Windows protected your PC"*, click **More info → Run anyway** (the app isn't code-signed yet).

            Moving to a new PC? In Bloom: **Settings → Backup → Save backup…**, then install on the new PC and **Restore backup…**.
